# Blueprint cho Render (https://render.com): API Node.js + PostgreSQL.
# Dashboard > New > Blueprint > chọn repo này. Điền các biến có sync: false sau khi tạo.
services:
  - type: web
    name: tptl-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tptl-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: tptl-db
    plan: free
