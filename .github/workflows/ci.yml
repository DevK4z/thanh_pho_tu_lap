name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm tra kiểu
        run: npm run typecheck
      - name: Test (shared, API trên PGlite, giao diện end-to-end)
        run: npm test
      - name: Build
        run: npm run build
